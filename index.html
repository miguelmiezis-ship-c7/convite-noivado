<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Convite Interativo</title>
  <style>
    body {
      margin: 0;
      font-family: 'Georgia', serif;
      background: linear-gradient(to bottom, #1a1a1a, #000);
      color: #fff;
      text-align: center;
    }
    .container {
      padding: 40px;
    }
    h1 {
      font-size: 2.5em;
      color: gold;
      text-shadow: 0 0 10px #ffd700, 0 0 20px #fff;
    }
    h2 {
      font-size: 1.5em;
      margin-top: 10px;
      color: #f5f5dc;
    }
    .details {
      margin: 20px 0;
      font-size: 1.2em;
      color: #ddd;
    }
    .buttons {
      margin-top: 30px;
    }
    .btn {
      display: inline-block;
      margin: 10px;
      padding: 15px 25px;
      font-size: 1.1em;
      color: #fff;
      background: gold;
      border-radius: 30px;
      text-decoration: none;
      box-shadow: 0 0 15px #ffd700, 0 0 25px #fff;
      transition: transform 0.2s;
    }
    .btn:hover {
      transform: scale(1.1);
    }
    .footer {
      margin-top: 40px;
      font-style: italic;
      color: #f5f5dc;
    }
  </style>
</head>
<body>
  <!-- Página Inicial -->
  <div class="container">
    <h1>Wilson Da Silva & Anastácia Cunge</h1>
    <h2>03 de outubro de 2026 — às 18h</h2>
    <div class="details">Salão de Eventos UTT, Rua do Weza Paradise</div>
    
    <!-- Página seguinte com botões -->
    <div class="buttons">
      <a href="https://docs.google.com/forms/SEU_LINK_AQUI" class="btn">💌 Confirmar Presença</a>
      <a href="https://maps.google.com/SEU_LINK_AQUI" class="btn">📍 Ver Localização</a>
      <a href="https://github.com/SEU_REPOSITORIO/foto-noivos.jpg" class="btn">📖 Manual do Bom Convidado</a>
    </div>
    
    <div class="footer">
      Será uma alegria celebrar este momento especial convosco 💗
    </div>
  </div>
</body>
</html>
