<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Convite de Noivado — Wilson & Anastácia</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      font-family: Georgia, serif;
      background: #fdf6e3;
      color: #333;
      text-align: center;
    }

    .convite {
      max-width: 600px;
      margin: 30px auto;
      padding: 35px 20px;
      background: #fffdf7;
      border: 1px solid #d2b48c;
      border-radius: 18px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.08);
    }

    h1 {
      color: #b8860b;
      font-size: 2.2em;
      margin-bottom: 15px;
    }

    .data {
      font-size: 1.15em;
      font-weight: bold;
    }

    .local {
      margin: 20px 0 30px;
      line-height: 1.6;
    }

    .button {
      display: block;
      margin: 12px auto;
      padding: 15px 20px;
      max-width: 350px;
      font-size: 1.05em;
      color: #fff;
      background: #b8860b;
      text-decoration: none;
      border-radius: 10px;
    }

    .button.secondary {
      background: #d2b48c;
    }

    .button.manual {
      background: #8b6f47;
    }

    .rodape {
      margin-top: 30px;
      font-size: 0.9em;
      color: #777;
    }
  </style>
</head>

<body>

  <div class="convite">

    <h1>Wilson Da Silva & Anastácia Cunge</h1>

    <p class="data">
      03 de outubro de 2026 — às 18h
    </p>

    <p class="local">
      📍 <strong>Salão de Eventos UTT</strong><br>
      Rua do Weza Paradise
    </p>

    <a
      href="https://forms.gle/fWTGRnVkcBpypAVR7"
      class="button">
      💌 Confirmar Presença
    </a>

    <a
      href="https://maps.app.goo.gl/F3u44V6Y1WVwVxPS6?g_st=aw"
      class="button secondary"
      target="_blank">
      📍 Ver Localização
    </a>

    <a
  href="https://drive.google.com/file/d/137pBak85dZzso8_fXvNavkc6j-bL9XA/view"
  class="button manual"
  target="_blank">
  📖 Manual do Bom Convidado
    </a>

    <p class="rodape">
      Será uma alegria celebrar este momento especial convosco. ❤️
    </p>

  </div>

</body>
</html>
